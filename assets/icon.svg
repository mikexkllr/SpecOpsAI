<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171b"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e89070"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- squircle tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="226" fill="none"
        stroke="#d97757" stroke-opacity="0.22" stroke-width="6"/>

  <!-- play / "ops" triangle: execution of the spec -->
  <g filter="url(#glow)">
    <path d="M392 300 L392 724 L726 512 Z"
          fill="url(#accent)" stroke="#f2a988" stroke-width="10"
          stroke-linejoin="round"/>
  </g>

  <!-- terminal prompt underscore: spec-driven dev shell -->
  <rect x="300" y="790" width="220" height="34" rx="17" fill="#d97757"/>
  <rect x="548" y="790" width="176" height="34" rx="17" fill="#d97757" fill-opacity="0.45"/>
</svg>
